# SAM deploy configuration
# This file is updated after running sam deploy --guided

version = 0.1

[default.deploy.parameters]
stack_name = "product-management"
resolve_s3 = true
s3_prefix = "product-management"
region = "ap-northeast-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "StageName=\"dev\""

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true
